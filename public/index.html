
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1"
    />

    <meta
      name="theme-color"
      content="#111827"
    />

    <!-- SEO Title -->
    <title>
      BILLQORA - Supermarket POS & Billing Software
    </title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="BILLQORA is a powerful supermarket POS and billing software for retail stores. Manage billing, inventory, customers, loyalty points, cash registers, invoices and sales reports."
    />

    <!-- SEO Keywords -->
    <meta
      name="keywords"
      content="BILLQORA, BILLQORA POS, supermarket POS software, supermarket billing software, retail POS software, retail billing software, POS billing software, billing software India, supermarket management software"
    />

    <!-- Author -->
    <meta
      name="author"
      content="BILLQORA"
    />

    <!-- Search Engine Instructions -->
    <meta
      name="robots"
      content="index, follow"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://billqora-pos.netlify.app/"
    />

    <!-- Open Graph / Social Sharing -->
    <meta
      property="og:title"
      content="BILLQORA - Supermarket POS & Billing Software"
    />

    <meta
      property="og:description"
      content="Powerful POS and billing software for supermarkets and retail stores. Manage billing, inventory, customers, loyalty points and sales."
    />

    <meta
      property="og:type"
      content="website"
    />

    <meta
      property="og:url"
      content="https://billqora-pos.netlify.app/"
    />

    <meta
      property="og:site_name"
      content="BILLQORA"
    />

    <!-- Twitter / X Sharing -->
    <meta
      name="twitter:card"
      content="summary"
    />

    <meta
      name="twitter:title"
      content="BILLQORA - Supermarket POS & Billing Software"
    />

    <meta
      name="twitter:description"
      content="Powerful POS and billing software for supermarkets and retail stores."
    />

    <!-- Favicon -->
    <link
      rel="icon"
      href="%PUBLIC_URL%/favicon.ico"
    />

    <!-- Apple Icon -->
    <link
      rel="apple-touch-icon"
      href="%PUBLIC_URL%/logo192.png"
    />

    <!-- Web App Manifest -->
    <link
      rel="manifest"
      href="%PUBLIC_URL%/manifest.json"
    />

    <!-- Google Fonts -->
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    />

    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>

  <body>
    <noscript>
      BILLQORA is a supermarket POS and billing software for
      managing billing, inventory, customers, loyalty points,
      invoices and daily retail store operations.
    </noscript>

    <div id="root"></div>

</html>
